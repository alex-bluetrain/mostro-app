name: deploy-web

# Releases here are created by release-please using GITHUB_TOKEN, and GitHub
# does not let GITHUB_TOKEN-created events trigger other workflows (anti-loop
# protection), so `on: release` would never fire. Instead the release-please
# workflow calls this one directly after publishing a release (workflow_call).
# workflow_dispatch remains for manual redeploys.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pull secrets from Infisical (project mostro, env prod, path /mostro-app)
      # via the official action. It authenticates as the Universal Auth machine
      # identity and injects each secret in that folder as an env var (masked in
      # logs) for the following steps:
      #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  -> wrangler deploy
      #   EXPO_PUBLIC_GOOGLE_CLIENT_ID, EXPO_PUBLIC_MOSTRO_SERVER_URL -> config.js
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: mostro-k-lpx
          env-slug: prod
          secret-path: /mostro-app

      # Runtime config consumed by the web build (window.__MOSTRO_CONFIG__).
      # Written before build so it is copied into dist/. These values are public
      # by design (visible in the client).
      - name: Write runtime config
        run: |
          cat > public/config.js <<EOF
          window.__MOSTRO_CONFIG__ = {
            GOOGLE_CLIENT_ID: '${EXPO_PUBLIC_GOOGLE_CLIENT_ID}',
            MOSTRO_SERVER_URL: '${EXPO_PUBLIC_MOSTRO_SERVER_URL}',
          };
          EOF

      - name: Build web
        run: pnpm run build:web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mostro-app
