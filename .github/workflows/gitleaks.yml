name: gitleaks

# This repo is public: block leaks of infra values (hostnames, IPs, GCP project
# ID) and personal emails. The rules live in .gitleaks.toml.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so it scans the history, not just the diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
